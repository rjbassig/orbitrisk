[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitrisk"
version = "0.1.0"
description = "Reproducible public-TLE conjunction screening and synthetic uncertainty experiments."
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "numpy", "scipy", "sgp4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
